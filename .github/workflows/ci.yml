name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every gate here only reads the checkout. Dependabot opens pull requests that run this
# workflow with third-party code already in the tree, so the token it runs under should
# not be able to write anything.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Format check
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      # Fails if syntaxes/flix.tmLanguage.json differs from what the TypeScript
      # source produces, so the committed artifact can never drift from its source.
      - name: Grammar is up to date
        run: npm run check:build

      # Use the same authority as check:pin and the extractor's actual-HEAD check.
      - name: Read compiler source revision
        id: compiler
        run: node --input-type=module -e "import { FLIX_COMPILER } from './scripts/external-checkout.mjs'; console.log('revision=' + FLIX_COMPILER.revision)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned compiler sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: flix/flix
          ref: ${{ steps.compiler.outputs.revision }}
          path: .flix-source
          persist-credentials: false

      # Regenerate before diffing: a diff on a clean checkout cannot detect stale data.
      - name: Lexicon matches pinned compiler sources
        env:
          FLIX_SOURCE: .flix-source
        run: npm run check:lexicon

      - name: Unit tests
        run: npm run test:unit

      - name: Scope documentation is complete
        run: npm run check:scopes

      - name: Unscoped-identifier check
        run: npm run test:unscoped

      - name: Script tests
        run: npm run test:scripts

      - name: Snapshot tests
        run: npm run test:snap
