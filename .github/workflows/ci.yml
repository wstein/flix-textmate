name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Format check
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      # Fails if syntaxes/flix.tmLanguage.json differs from what the TypeScript
      # source produces, so the committed artifact can never drift from its source.
      - name: Grammar is up to date
        run: npm run check:build

      # The lexicon manifest is generated and committed. Prettier is configured not to
      # touch it, because reformatting a generated file makes the committed copy stop
      # matching what its generator emits.
      - name: Lexicon manifest is unmodified
        run: git diff --exit-code -- src/typescript/lexicon.generated.ts

      - name: Unit tests
        run: npm run test:unit

      - name: Scope documentation is complete
        run: npm run check:scopes

      - name: Unscoped-identifier check
        run: npm run test:unscoped

      - name: Snapshot tests
        run: npm run test:snap
