name: Prepare and publish npm package

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/npm-publish.yml
      - syntaxes/**
      - src/**
      - tests/**
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish the verified tarball using npm Trusted Publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:build
      - run: npm test
      - name: Pack release tarball
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
      - name: Load the packed grammar in Shiki
        run: |
          smoke_dir=$(mktemp -d)
          cd "$smoke_dir"
          npm init --yes > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/package/*.tgz shiki@4.6.0
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import flix from 'flix-textmate' with { type: 'json' };
          import { createHighlighter } from 'shiki';

          assert.equal(flix.scopeName, 'source.flix');
          const highlighter = await createHighlighter({
            langs: [{ ...flix, name: 'flix' }],
            themes: ['github-dark'],
          });
          try {
            const tokens = highlighter.codeToTokens('pub def smoke(): Int32 = 42', {
              lang: 'flix',
              theme: 'github-dark',
            }).tokens.flat();
            assert.ok(tokens.some((token) => token.content.trim() === 'def'));
            assert.ok(tokens.some((token) => token.content.trim() === '42'));
            assert.ok(new Set(tokens.map((token) => token.color)).size > 1);
          } finally {
            highlighter.dispose();
          }
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error

  publish_npm:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_npm
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted Publishing requires npm >= 11.5.1.
      - run: npm install --global npm@11.6.2
      - name: Publish the verified tarball to npm
        run: npm publish ./npm-package/*.tgz --provenance --access public
